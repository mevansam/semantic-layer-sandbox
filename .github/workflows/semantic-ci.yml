# Monorepo CI: every gate for every repo, sub-domain and business domain.
# (Per-folder .github/workflows are kept for when repos are split out; GitHub only
#  runs workflows from the repository root.)
name: semantic-ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true        # FIBO, pinned (fibo-extensions/vendor/fibo)
          fetch-depth: 0          # `make changes` compares with the base branch
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: FIBO pin (cache key)
        id: pin
        run: echo "fibo=$(git ls-files -s fibo-extensions/vendor/fibo | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache ROBOT and FIBO's OMG dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            fibo-extensions/vendor/omg
          key: deps-${{ hashFiles('Makefile') }}-${{ steps.pin.outputs.fibo }}
      - name: Set up (venv, Java check, ROBOT, FIBO, OMG Commons/LCC)
        run: make setup
      - name: Verify (gates G1-G8)
        run: make verify
      - name: Version bumps match change classes (pull requests)
        if: github.event_name == 'pull_request'
        run: make changes BASE=origin/${{ github.base_ref }}
      - name: Full OWL DL coherence per business domain (HermiT)
        run: make hermit
      - name: Template alignment
        run: make align
      - name: Tooling self-test (each check catches a seeded defect)
        run: make selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-graphs
          path: domains/**/build/
          if-no-files-found: ignore
