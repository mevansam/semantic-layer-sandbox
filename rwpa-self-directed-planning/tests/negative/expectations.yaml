# Negative test cases: each file MUST trigger the listed business rules (gate G5).
# Each file is validated together with the positive examples (so it can reuse them).
cases:
  - name: self-directed insight recommends buying a security (advice boundary)
    file: nc-001-buy-recommendation.ttl
    expect_violations: [SDP-R-001]
  - name: incomplete goal (no target date, amount without currency)
    file: nc-002-incomplete-goal.ttl
    expect_violations: [SDP-R-002]
  - name: unsourced life expectancy and retirement scenario without it
    file: nc-003-unsourced-life-expectancy.ttl
    expect_violations: [SDP-R-003, SDP-R-007]
  - name: health score out of range and without model version
    file: nc-004-invalid-health-score.ttl
    expect_violations: [SDP-R-004]
  - name: insight without model provenance or category
    file: nc-005-insight-without-provenance.ttl
    expect_violations: [SDP-R-005]
  - name: probability of success above 1
    file: nc-006-probability-out-of-range.ttl
    expect_violations: [SDP-R-006]
