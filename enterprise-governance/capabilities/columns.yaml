# Column mapping for the enterprise capability map (capabilities/source/capability-map.csv).
# Map the importer's fields (left) to the headers used in the source file (right).
columns:
  domain: Domain Name                # business (API) domain
  ontology_domain: Ontology Domain   # named data ontology grouping the domains
  levels:                            # capability hierarchy, top to bottom
    - capability l1 name
    - capability l2 name
    - capability l3 name
    - capability l4 name
