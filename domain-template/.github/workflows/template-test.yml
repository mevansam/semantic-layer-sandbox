name: template-test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: domain-template }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/enterprise-semantic-governance", path: enterprise-semantic-governance }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/fibo-extensions", path: fibo-extensions, submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          pip install -r enterprise-semantic-governance/requirements.txt
          bash fibo-extensions/scripts/fetch-omg-dependencies.sh
          curl -sSL -o robot.jar https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar
          python domain-template/scripts/new_domain.py --answers domain-template/answers/pg-fpm.yaml --out generated --no-git
          python enterprise-semantic-governance/tools/semtool.py codeowners --repo generated
          ROBOT_JAR=$PWD/robot.jar python enterprise-semantic-governance/tools/semtool.py verify --repo generated
