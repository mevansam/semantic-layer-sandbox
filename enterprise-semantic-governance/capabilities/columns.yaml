# Column mapping for the capability map importer.
#
# Map each field the importer needs (left) to the column header used in YOUR
# capability map file (right). When the authoritative capability map arrives,
# only this file should need to change. Leave a value empty ("") if your file
# has no such column.
columns:
  capability_id: capability_id            # stable id, e.g. CAP-RWPA-01
  capability_name: capability_name
  parent_capability_id: parent_capability_id
  business_domain: business_domain        # accountable business domain
  sub_domain: sub_domain                  # optional sub-domain
  data_ontology: data_ontology            # named data ontology for the domain
  taxonomy_anchors: taxonomy_anchors      # ';'-separated taxonomy notations, labels or local names
  description: description
