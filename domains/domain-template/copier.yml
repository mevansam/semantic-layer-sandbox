# Copier template for a business (sub-)domain semantic repository.
#   copier copy domain-template ../<new-repo>          (Copier >= 9)
#   python scripts/new_domain.py --answers answers.yaml --out ../<new-repo>   (no Copier needed)
# Later template improvements can be pulled into existing domains with `copier update`.

_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Domain-owned content: generated once, then edited in place by the domain.
# `copier update` never overwrites these, so template improvements to them are
# applied by hand (see CHANGELOG). Everything else - CI, .gitignore, mappings
# conventions, semantic.yaml wiring - is template-owned and updates cleanly.
_skip_if_exists:
  - README.md
  - domain-manifest.ttl
  - ontology/*.ttl
  - rules/*.ttl
  - processes/*.ttl
  - apis/*
  - stewardship/*.ttl
  - records/*.ttl
  - collections/*.ttl
  - execution-models/**
  - competency-questions/*
  - examples/*.ttl
  - tests/negative/*
  - docs/*.md

# ---- Identity (must match the capability map and the domain registry; ADR-0004) ----
ontology_domain_name:
  type: str
  help: Ontology domain of the business domain in the capability map, e.g. Investment Servicing (metadata only - not part of IRIs)
  default: "Example Ontology Domain"
parent_domain_name:
  type: str
  help: Business domain this sub-domain belongs to, exactly as in the capability map, e.g. Retail Wealth Management
  default: "Example Business Domain"
parent_domain_slug:
  type: str
  help: Folder and IRI segment of the business domain (domains/<parent>/...)
  default: "example-business-domain"
domain_name:
  type: str
  help: Sub-domain name as declared in capabilities/curation.yaml, e.g. Planning and Guidance
  default: "Example Sub-Domain"
domain_slug:
  type: str
  help: Folder and IRI segment of the sub-domain
  default: "example-sub-domain"
namespace_path:
  type: str
  help: Namespace path below {base}domain/ - derived, do not change
  default: "{{ parent_domain_slug }}/{{ domain_slug }}"
  when: false
registry_code:
  type: str
  help: Domain code registered in fibo-extensions/registry (used in graph names and rule ids)
  default: "exb-exs"
rule_prefix:
  type: str
  help: Prefix for business rule identifiers
  default: "EXD"
prefix:
  type: str
  help: Turtle prefix for the domain's terms
  default: "exd"
module_name:
  type: str
  help: Name of the first ontology module
  default: "core"
capability_domain_iri:
  type: str
  help: IRI of the sub-domain in the capability map ({base}capability/domain/{ontology-domain}/{business-domain}/{sub-domain})
  default: "https://ontology.example.com/capability/domain/example-ontology-domain/example-business-domain/example-sub-domain"
capabilities:
  type: yaml
  help: Capability local names (path IDs) from capabilities/capability-map.ttl realized by this domain
  default: [example-capability]
taxonomy_anchors:
  type: yaml
  help: Enterprise taxonomy local names this domain elaborates
  default: [customers.customer-profile]

# ---- Seed concept (replace with real modelling after generation) -----------------
seed_class:
  type: str
  default: "ExampleConcept"
seed_class_label:
  type: str
  default: "example concept"
seed_class_definition:
  type: str
  default: "placeholder concept to be replaced by the first real concept of the domain"
seed_class_parent:
  type: str
  help: FIBO parent as a CURIE from the enterprise profile
  default: "fibo-fnd-pas-pas:Product"
seed_class_anchor:
  type: str
  default: "customers.customer-profile"

# ---- Accountable roles (become CODEOWNERS) ------------------------------------------
github_org:
  type: str
  default: example-org
repo_name:
  type: str
  default: "example-domain-repo"
domain_owner:
  type: str
  default: "Domain Owner (name)"
domain_owner_team:
  type: str
  default: "@example-org/exd-domain-owners"
rule_owner:
  type: str
  default: "Rule Owner (name)"
rule_owner_team:
  type: str
  default: "@example-org/exd-rule-owners"
api_owner:
  type: str
  default: "API Owner (name)"
api_owner_team:
  type: str
  default: "@example-org/exd-api-owners"
data_steward:
  type: str
  default: "Data Steward (name)"
data_steward_team:
  type: str
  default: "@example-org/exd-data-stewards"
records_owner:
  type: str
  default: "Records Owner (name)"
records_owner_team:
  type: str
  default: "@example-org/exd-records"
ai_risk_owner:
  type: str
  default: "AI Risk Office (placeholder)"
ai_risk_owner_team:
  type: str
  default: "@example-org/ai-risk-office"

# ---- Enterprise wiring -------------------------------------------------------------------
# ---- Parent layer (used only when the business-domain folder is scaffolded) -----------
parent_registry_code:
  type: str
  help: Registry code of the business domain, e.g. rwm
  default: "exb"
parent_domain_owner:
  type: str
  help: Business-domain owner (settles overlaps between its sub-domains)
  default: "Business Domain Owner (name)"
parent_domain_owner_team:
  type: str
  default: "@example-org/exb-domain-owners"

# ---- Extension point: sub-domains this one builds on ---------------------------------
dependencies:
  type: yaml
  help: >-
    Sibling sub-domains whose PUBLISHED modules this sub-domain imports, as a list of
    {path, domain_iri, module} (path relative to this repo). Dependencies run one way; no cycles.
  default: []

# ---- Enterprise wiring (repos live at domains/<business-domain>/<sub-domain>) ----------
base_iri:
  type: str
  default: https://ontology.example.com/
governance_path:
  type: str
  default: ../../../enterprise-semantic-governance
fibo_extensions_path:
  type: str
  default: ../../../fibo-extensions
created:
  type: str
  default: "2026-09-28"
